<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D body: lighter top-left to darker bottom-right -->
    <linearGradient id="body" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(33 100% 63%)"/>
      <stop offset="0.5" stop-color="hsl(27 99% 55%)"/>
      <stop offset="1" stop-color="hsl(18 92% 40%)"/>
    </linearGradient>
    <!-- glossy top highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#body)"/>
  <!-- top gloss for the 3D sheen -->
  <rect x="3" y="3" width="58" height="34" rx="15" fill="url(#gloss)"/>
  <!-- soft inner edge -->
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- extruded shadow of the J -->
  <text x="34" y="46" font-family="'JetBrains Mono','Courier New',monospace" font-size="40" font-weight="700"
        text-anchor="middle" fill="hsl(16 90% 30%)" fill-opacity="0.6">J</text>
  <!-- main J -->
  <text x="32.5" y="44.5" font-family="'JetBrains Mono','Courier New',monospace" font-size="40" font-weight="700"
        text-anchor="middle" fill="#fff6e8">J</text>

  <!-- a resting glint so the static icon already sparkles -->
  <circle cx="47" cy="17" r="2.2" fill="#ffffff" fill-opacity="0.9"/>
</svg>
